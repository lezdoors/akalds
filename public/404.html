<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page introuvable | Akal Digital Services Ltd</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .wrap { max-width: 480px; }
      img.logo { width: 48px; height: auto; margin-bottom: 32px; opacity: 0.9; }
      .code {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        margin-bottom: 16px;
      }
      h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 12px; }
      p { font-size: 15px; line-height: 1.6; color: rgba(255, 255, 255, 0.6); margin-bottom: 32px; }
      a.btn {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 9999px;
        background: #fff;
        color: #1c1917;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      a.btn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/brand/akal-logo-white.png" alt="Akal Digital Services" />

      </p>
      <a class="btn" href="/">Retour à l'accueil</a>
    </div>
  </body>
</html>
